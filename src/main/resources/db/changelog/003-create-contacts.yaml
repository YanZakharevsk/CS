databaseChangeLog:
  - changeSet:
      id: 1
      author: hoks
      changes:
        - createTable:
            tableName: contacts

            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: banned
                  type: boolean
                  constraints:
                    nullable: false

        - createIndex:
            indexName: "contacts_user_id_index"
            tableName: "contacts"
            columns:
              - column:
                  name: user_id