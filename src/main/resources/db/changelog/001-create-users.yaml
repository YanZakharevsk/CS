databaseChangeLog:
  - changeSet:
      id: 1
      author: hoks

      changes:
        - createTable:
            tableName: users

            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP



        - sql:
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT chk_name_length
              CHECK (LENGTH(name) >= 1)
        - sql:
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT chk_surname_length
              CHECK (LENGTH(surname) >= 2)

        - sql:
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT chk_email_format
              CHECK (email ~* '^[A-Za-z0-9._%-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,6}$');

              ALTER TABLE users
              ADD CONSTRAINT chk_birth_date_format
              CHECK (birth_date <= CURRENT_DATE - INTERVAL '18 years');

        

        - createIndex:
            indexName: "users_name_and_surname_index"
            tableName: users
            columns:
              - column:
                  name: name
              - column:
                  name: surname

        - createIndex:
            indexName: "users_email_index"
            tableName: users
            columns:
              - column:
                  name: email