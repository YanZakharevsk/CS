databaseChangeLog:
  - changeSet:
      id: 1
      author: hoks

      changes:
        - createTable:
            tableName: "user_contacts"

            columns:
              - column:
                  name: "user_id"
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: "contact_id"
                  type: UUID
                  constraints:

        - addPrimaryKey:
            tableName: user_contacts
            columnNames: user_id, contact_id
            constraintName: pk_user_contacts

        - addForeignKeyConstraint:
            baseTableName: user_contacts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_contacts_user

        - addForeignKeyConstraint:
            baseTableName: user_contacts
            baseColumnNames: contact_id
            referencedTableName: contacts
            referencedColumnNames: id
            constraintName: fk_user_contacts_user2
