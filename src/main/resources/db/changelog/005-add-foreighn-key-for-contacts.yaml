databaseChangeLog:
  - changeSet:
      id: add_foreign_key
      author: hoks

      changes:
        - addForeignKeyConstraint:
            baseTableName: contacts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: "fk_user_id"

  - changeSet:
      id: drop_contacts_table
      author: hoks

      changes:
        - dropTable:
            tableName: contacts
            cascadeConstraints: true

  - changeSet:
      id: rename_user_contacts_column
      author: hoks

      changes:
        - renameColumn:
            tableName: user_contacts
            oldColumnName: user_id
            newColumnName: owner_id

        - renameColumn:
            tableName: user_contacts
            oldColumnName: contact_id
            newColumnName: target_id

  - changeSet:
      id: remove_all_user_contacts_constraints
      author: hoks
      changes:
        - dropAllForeignKeyConstraints:
            baseTableName: user_contacts

  - changeSet:
      id: create_new_foreign_constraints
      author: hoks
      changes:
        - addForeignKeyConstraint:
            baseTableName: user_contacts
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_owner_user_contacts

        - addForeignKeyConstraint:
            baseTableName: user_contacts
            baseColumnNames: target_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_target_user_contacts

  - changeSet:
      id: add_banned_field
      author: hoks
      changes:
        - addColumn:
            tableName: user_contacts
            columns:
              - column:
                  name: banned
                  type: boolean
                  constraints:
                    nullable: false









